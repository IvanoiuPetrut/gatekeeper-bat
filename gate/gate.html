<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gatekeeper Bat</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="../lib/fonts/fonts.css">
  <link rel="stylesheet" href="../lib/styles.css">
  <script src="../lib/font.js"></script>
  <link rel="stylesheet" href="../games/shared.css">
  <link rel="stylesheet" href="../games/sudoku/sudoku.css">
  <link rel="stylesheet" href="../games/lightsout/lightsout.css">
  <link rel="stylesheet" href="../games/minesweeper/minesweeper.css">
  <link rel="stylesheet" href="../games/nonogram/nonogram.css">
  <link rel="stylesheet" href="gate.css">
</head>
<body class="has-bat">
  <main class="gate">
    <header class="gate-header on-sky">
      <p class="gate-eyebrow">
        <span class="orn sm" aria-hidden="true">k</span>
        Gatekeeper Bat
        <span class="orn sm" aria-hidden="true">k</span>
      </p>
      <h1>Is <span id="domain">this site</span> worth a puzzle?</h1>
      <p class="muted" id="subtitle">Solve it to get in.</p>
    </header>

    <section id="game" class="gate-game"></section>

    <section id="message" class="card gate-message" hidden></section>

    <p class="garden orn" aria-hidden="true">fgbgfdfgbgf</p>
  </main>

  <div id="solved" class="gate-overlay" hidden>
    <div class="card gate-solved" role="dialog" aria-modal="true" aria-labelledby="solved-title">
      <h2 id="solved-title">Solved!</h2>
      <p id="solved-text" class="muted"></p>
      <button id="continue" class="primary">Continue</button>
    </div>
  </div>

  <script src="../lib/common.js"></script>
  <script src="../games/sudoku/engine.js"></script>
  <script src="../games/sudoku/ui.js"></script>
  <script src="../games/shared.js"></script>
  <script src="../games/lightsout/engine.js"></script>
  <script src="../games/lightsout/ui.js"></script>
  <script src="../games/minesweeper/engine.js"></script>
  <script src="../games/minesweeper/ui.js"></script>
  <script src="../games/nonogram/engine.js"></script>
  <script src="../games/nonogram/pictures.js"></script>
  <script src="../games/nonogram/ui.js"></script>
  <script src="gate.js"></script>
</body>
</html>
